# Community Cloud > Advanced settings > Secrets에만 입력. 실제 비밀값은 Git 금지.
[dashboard]
data_source = "api"

[data_api]
url = "https://YOUR-API-HOST"
token = "REPLACE_WITH_RANDOM_TOKEN_AT_LEAST_32_CHARACTERS"

# DB 암호, [connections.mysql], AWS 자격증명은 Cloud에 넣지 않는다.
# 관리자 복원 설정은 secrets.admin.example.toml 참고. 일반 조회키와 관리자키는 다르게 설정.
