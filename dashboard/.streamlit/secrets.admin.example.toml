# Codex 2026-10-04: 설정 양식만. 실제 값은 서버/Cloud Secrets에만 입력하고 Git 금지.
# 1) Cloud 앱의 기존 [dashboard]/[data_api] 설정에 아래를 추가한다.
[admin]
api_token = "REPLACE_WITH_DIFFERENT_ADMIN_TOKEN_AT_LEAST_32_CHARACTERS"
# 로그인 공급자의 검증된 iss와 sub. 이메일·이름이 아니라 계정 고유 ID 사용.
identities = ["https://accounts.google.com|REPLACE_WITH_ADMIN_SUBJECT_ID"]
# 추가 관리자는 사전 승인한 Gmail만. Google 로그인과 email_verified=true가 필수.
google_emails = []

[auth]
redirect_uri = "https://YOUR-DASHBOARD-HOST/oauth2callback"
cookie_secret = "REPLACE_WITH_RANDOM_COOKIE_SECRET"
client_id = "REPLACE_WITH_OIDC_CLIENT_ID"
client_secret = "REPLACE_WITH_OIDC_CLIENT_SECRET"
server_metadata_url = "https://accounts.google.com/.well-known/openid-configuration"

# 2) PC API 서버 secrets에만 아래 설정을 추가한다. Cloud에는 넣지 않는다.
# [admin_api]
# token = "REPLACE_WITH_DIFFERENT_ADMIN_TOKEN_AT_LEAST_32_CHARACTERS"
# 위 admin.api_token과 동일한 별도 키. data_api.token과 같으면 서버 시작을 거부한다.
# 로컬 [admin] password 로그인 방식은 기존대로 유지하며 공개 앱에서는 사용하지 않는다.
